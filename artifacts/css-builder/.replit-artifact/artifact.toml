kind = "web"
previewPath = "/"
title = "CSS File Builder"
version = "1.0.0"
id = "artifacts/css-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19141

[services.development]
run = "pnpm --filter @workspace/css-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/css-builder", "run", "build" ]
publicDir = "artifacts/css-builder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19141"
BASE_PATH = "/"
